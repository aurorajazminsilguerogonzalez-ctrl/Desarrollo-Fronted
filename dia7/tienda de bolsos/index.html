<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <title>Tienda de Bolsos</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <h1>Nuestra Coleccion</h1>
        <div class="galeria">
             <div class="producto" data-nombre="Bolso Rosa">
                <img src="images/bolso rosa.jpg" alt="Bolso Rosa"/>
                <p>Bolso Rosa</p>
                <p class="precio">Gs 200.000</p>
            </div>
            <div class="producto" data-nombre="Bolso Beige">
                <img src="images/bolso beige.jpg" alt="Bolso Beige"/>
                <p>Bolso Beige</p>
                <p class="precio">Gs 200.000</p>
            </div>
            <div class="producto" data-nombre="Bolso en tonos tierra">
                <img src="images/bolso en tonos tierra.jpg" alt="Bolso en tonos tierra"/>
                <p>Bolso en tonos tierra</p>
                <p class="precio">Gs 200.000</p>
            </div>
            <div class="producto" data-nombre="Mochila con detalles cafe">
                <img src="images/mochila con detalles cafe.jpg" alt="Mochila con detalles cafe"/>
                <p>Mochila con detalles cafe</p>
                <p class="precio">Gs 200.000</p>
            </div>
            <div class="producto" data-nombre="Mochila Roja">
                <img src="images/mochila roja.jpg" alt="Mochila Roja"/>
                <p>Bolso Roja</p>
                <p class="precio">Gs 200.000</p>
             <div class="producto" data-nombre="Mochila Negra">
                <img src="images/mochila negra.jpg" alt="Mochila Negra"/>
                <p>Bolso Negra</p>
                <p class="precio">Gs 200.000</p>
        </div>
    
        <script src="script.js"></script>
    </body>
</html>
